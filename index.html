<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090b">
<title>Grimorium Verum — Official</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090b;--bg2:#0a0d10;--ink:#dddcd5;--soft:#a6a6a0;--dim:#6f7477;
  --line:rgba(223,224,218,.13);--line-strong:rgba(223,224,218,.32);--red:#8b1e23;
  --serif:"Cormorant Garamond",Georgia,serif;--sans:"Manrope",Arial,sans-serif;
  --pad:clamp(20px,4.7vw,72px);--shell:1380px
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
img{display:block;max-width:100%}
::selection{background:#dddcd5;color:#07090b}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:100;opacity:.028;mix-blend-mode:screen;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.86' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E")}
.shell{width:min(var(--shell),100%);margin:auto;padding-inline:var(--pad)}
.rule{width:52px;height:1px;background:var(--red)}

header{
  position:absolute;z-index:20;inset:0 0 auto;height:92px;
  display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;padding-inline:var(--pad);
  border-bottom:1px solid rgba(255,255,255,.05);
  background:linear-gradient(180deg,rgba(5,7,8,.58),rgba(5,7,8,0))
}
.brand{display:inline-flex;align-items:center;width:max-content}
.brand img{
  width:clamp(168px,15vw,230px);height:auto;max-height:72px;object-fit:contain;object-position:left center;
  mix-blend-mode:normal;filter:drop-shadow(0 3px 16px rgba(0,0,0,.45))
}
nav{justify-self:center;display:flex;gap:clamp(22px,2.6vw,38px)}
nav{grid-column:2}
nav a{font-family:var(--serif);font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:#bdbdb6}
nav a:hover{color:#fff}

.hero{height:100svh;min-height:720px;max-height:980px;position:relative;overflow:hidden;background:#07090b}
.hero-art{
  position:absolute;inset:0;
  background:
    linear-gradient(90deg,rgba(4,6,7,.77) 0%,rgba(4,6,7,.48) 27%,rgba(4,6,7,.13) 58%,rgba(4,6,7,.12) 77%,rgba(4,6,7,.34) 100%),
    linear-gradient(0deg,#07090b 0%,rgba(7,9,11,.25) 17%,transparent 38%),
    url("assets/renaissance-cover.jpg") center 45%/cover no-repeat;
  filter:saturate(.82) contrast(1.04) brightness(.9);
  transform:scale(1.01)
}
.hero:after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 62% 44%,transparent 0 31%,rgba(0,0,0,.13) 58%,rgba(0,0,0,.48) 100%)
}
.hero-inner{position:relative;z-index:3;height:100%;display:flex;align-items:center;padding:124px var(--pad) 72px}
.hero-copy{width:min(730px,67vw);margin-top:70px;min-width:0}
.hero-side{display:flex;gap:16px;align-items:flex-start;margin-bottom:48px}
.hero-side .vline{width:1px;height:65px;background:rgba(255,255,255,.34)}
.hero-side span{font-family:var(--serif);font-size:12px;line-height:1.5;letter-spacing:.22em;text-transform:uppercase;color:#b8b8b1}
.hero h1{
  margin:0;font-family:var(--serif);font-weight:400;
  font-size:clamp(50px,8.2vw,120px);line-height:.82;letter-spacing:.075em;text-transform:uppercase;
  text-shadow:0 6px 40px rgba(0,0,0,.85);white-space:nowrap
}
.hero-sub{margin-top:24px;font-family:var(--serif);font-size:clamp(16px,1.7vw,27px);letter-spacing:.2em;text-transform:uppercase;color:#d0cec7}
.listen{margin-top:44px;display:flex;align-items:center;gap:16px;font-family:var(--serif);font-size:15px;letter-spacing:.2em;text-transform:uppercase}
.listen:before{content:"";width:108px;height:1px;background:#c2c2bc}
.services{display:flex;gap:22px;margin-top:15px;font-family:var(--serif);font-size:14px;color:#a5a69f}
.services a:hover{color:#fff}

.record{
  position:relative;padding:72px 0 92px;background:
  radial-gradient(circle at 84% 30%,rgba(25,31,35,.25),transparent 28%),
  linear-gradient(180deg,#080b0d,#07090b);
  border-top:1px solid rgba(255,255,255,.05)
}
.record:before{
  content:"";position:absolute;right:0;top:0;bottom:0;width:24%;
  background:url("https://grimorium-verum.ru/images/page2-img4.jpg") center/cover no-repeat;
  filter:grayscale(1) brightness(.19) contrast(1.1);opacity:.46;
  mask-image:linear-gradient(90deg,transparent,#000 55%);-webkit-mask-image:linear-gradient(90deg,transparent,#000 55%)
}
.record-head{position:relative;z-index:2;margin-bottom:38px}
.record-head h2{
  font-family:var(--serif);font-weight:400;font-size:clamp(38px,4.8vw,62px);
  letter-spacing:.16em;line-height:.95;margin:0;text-transform:uppercase
}
.discography-grid{
  position:relative;z-index:2;display:grid;min-width:0;
  grid-template-columns:72px minmax(250px,292px) minmax(300px,380px) minmax(360px,1fr) 52px;
  gap:clamp(20px,2.5vw,38px);align-items:stretch;
  height:520px
}
.album-tabs{
  display:flex;flex-direction:column;justify-content:center;gap:11px;
  min-width:0;align-self:stretch
}
.album-tab{
  position:relative;flex:0 0 auto;width:62px;height:62px;padding:0;
  border:1px solid transparent;background:#101214;opacity:.38;cursor:pointer;
  transition:opacity .2s ease,border-color .2s ease;overflow:hidden
}
.tab-fallback{
  position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);
  font-size:13px;letter-spacing:.08em;color:#777;z-index:0
}
.album-tab img{width:100%;height:100%;object-fit:cover;filter:saturate(.52);position:relative;z-index:1}
.album-tab:hover{opacity:.78}
.album-tab.active{opacity:1;border-color:#b5b6b1}
.track-col,.cover-col,.stream-col{min-width:0;height:100%}
.track-col{display:flex;flex-direction:column;justify-content:flex-start}
#tracklist{min-height:0;overflow:hidden}
.cover-col{display:flex;flex-direction:column;justify-content:center}
.track-col h3{
  font-family:var(--serif);font-size:clamp(23px,2vw,31px);font-weight:400;
  letter-spacing:clamp(.065em,.14vw,.12em);line-height:1;margin:0 0 17px;
  text-transform:uppercase;white-space:nowrap
}
.track-col .rule{margin-bottom:15px}
.track{display:grid;grid-template-columns:25px minmax(0,1fr);gap:9px;padding:4px 0;font-family:var(--serif);font-size:13.5px;line-height:1.25;letter-spacing:.035em;color:#aaa9a4}
.track span:first-child{font-family:var(--sans);font-size:9px;color:#686d70;padding-top:2px}
.track span:last-child{min-width:0;overflow-wrap:break-word;word-break:normal}
.cover-wrap{border:1px solid rgba(220,222,217,.36);padding:9px;background:#090b0d;width:100%;max-width:380px;margin-inline:auto}
.cover{width:100%;aspect-ratio:1;object-fit:cover;filter:saturate(.65) contrast(1.03)}
.cover-fallback{
  aspect-ratio:1;display:flex;align-items:flex-end;padding:25px;
  background:radial-gradient(circle at 55% 30%,rgba(114,26,30,.32),transparent 28%),linear-gradient(145deg,#121619,#050607);
  font-family:var(--serif);font-size:clamp(24px,3vw,38px);line-height:1;white-space:nowrap;letter-spacing:.08em
}
.album-name{text-align:center;margin-top:14px;font-family:var(--serif);font-size:16px;letter-spacing:.25em;text-transform:uppercase}
.stream-col{display:flex;flex-direction:column;justify-content:stretch}
.player{
  width:100%;height:100%;min-height:0;border:1px solid var(--line);
  border-radius:10px;overflow:hidden;background:#111
}
.player iframe{display:block;width:100%;height:100%;min-height:100%;border:0;background:#111}
.platforms{
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  gap:10px;margin:0;height:100%
}
.platform{
  position:relative;width:44px;height:44px;border:1px solid var(--line);
  display:grid;place-items:center;background:rgba(7,9,11,.58);
  transition:.18s ease
}
.platform:hover{border-color:#777d7f;background:#14181b}
.platform img{width:20px;height:20px;object-fit:contain;opacity:.86}
.platform:hover img{opacity:1}

.bottom{display:block;background:#080a0c;border-top:1px solid var(--line)}
.live,.contact{position:relative;width:100%;padding:58px var(--pad)}
.live{
  min-height:310px;background:
  linear-gradient(90deg,rgba(6,8,10,.96),rgba(6,8,10,.67) 55%,rgba(6,8,10,.82)),
  url("https://grimorium-verum.ru/images/page2-img1.jpg") center 42%/cover no-repeat;
  border-bottom:1px solid var(--line)
}
.live-inner,.contact-inner{width:min(var(--shell),100%);margin:auto}
.live p,.contact p{font-family:var(--serif);font-size:16px;color:#999b97}
.contact{min-height:250px;background:linear-gradient(180deg,#090b0d,#06080a)}
.contact-row{display:flex;justify-content:space-between;gap:36px;align-items:flex-end}
.contact-copy{min-width:0}
.socials{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.social-link{
  width:46px;height:46px;border:1px solid var(--line);display:grid;place-items:center;
  background:rgba(255,255,255,.015);transition:.18s ease
}
.social-link:hover{border-color:#757b7d;background:#121619;transform:translateY(-2px)}
.social-link img{width:20px;height:20px;object-fit:contain;opacity:.84}
.social-link:hover img{opacity:1}
.social-link svg{width:21px;height:21px;fill:none;stroke:#d7d7d1;stroke-width:1.6}
.email-text{font-family:var(--serif);font-size:15px;letter-spacing:.08em;color:#b8b9b4;white-space:nowrap}
.email-text:hover{color:#fff}

footer{
  padding:20px var(--pad);display:flex;justify-content:space-between;gap:20px;
  border-top:1px solid var(--line);font-size:8px;letter-spacing:.17em;text-transform:uppercase;color:#5f6568
}

@media(max-width:1120px){
  .discography-grid{
    grid-template-columns:62px minmax(210px,255px) minmax(260px,320px) minmax(300px,1fr) 48px;
    gap:18px;height:500px
  }
}
@media(max-width:900px){
  header{height:76px;padding-inline:24px}.brand img{width:180px}nav{display:none}
  .hero{height:auto;min-height:720px}.hero-copy{width:86vw}
  .hero h1{font-size:clamp(48px,11vw,90px)}
  .discography-grid{
    grid-template-columns:62px minmax(220px,1fr) minmax(280px,1.15fr);
    gap:22px;height:auto;align-items:start
  }
  .album-tabs{grid-row:1;grid-column:1;min-height:430px}
  .track-col{grid-row:1;grid-column:2;min-height:430px}
  .cover-col{grid-row:1;grid-column:3;min-height:430px}
  .stream-col{grid-row:2;grid-column:2/4;height:380px}
  .platforms{grid-row:2;grid-column:1;height:380px}
}
@media(max-width:720px){
  :root{--pad:18px}
  header{padding-inline:18px;height:72px;grid-template-columns:1fr}.brand img{width:155px;max-width:55vw}
  .hero{min-height:640px}.hero-art{background-position:58% 45%;filter:saturate(.84) contrast(1.03) brightness(.86)}
  .hero-inner{align-items:flex-end;padding:96px 18px 68px}.hero-copy{width:100%;margin:0}
  .hero-side{margin-bottom:30px}.hero-side span{font-size:10px}.hero-side .vline{height:54px}
  .hero h1{font-size:clamp(37px,11.3vw,68px);letter-spacing:.038em;white-space:nowrap}
  .hero-sub{font-size:14px;line-height:1.35;letter-spacing:.13em}
  .listen{margin-top:32px}.listen:before{width:62px}.services{gap:14px;flex-wrap:wrap;font-size:13px}
  .record{padding:48px 0 66px}.record-head{margin-bottom:24px}.record-head h2{font-size:clamp(35px,11vw,50px);letter-spacing:.12em}
  .discography-grid{display:flex;flex-direction:column;align-items:stretch;gap:25px;height:auto}
  .album-tabs{order:0;flex-direction:row;justify-content:flex-start;overflow-x:auto;align-self:auto;padding:4px 2px 8px;scrollbar-width:none}
  .album-tabs::-webkit-scrollbar{display:none}
  .album-tab{width:58px;height:58px;flex:0 0 58px}
  .cover-col{order:1;width:min(100%,420px);align-self:center}
  .track-col{order:2;width:100%}
  .stream-col{order:3;width:100%}
  .platforms{order:4;width:100%}
  .track-col h3{font-size:clamp(23px,7vw,29px)}
  .track{font-size:13px;grid-template-columns:23px minmax(0,1fr)}
  .player,.player iframe{height:390px;min-height:390px}
  .platforms{height:auto;flex-direction:row;justify-content:center}
  .live,.contact{padding:46px 18px}.contact-row{display:block}.email-text{display:inline-block;margin-top:20px;white-space:normal}
  footer{flex-direction:column;padding-inline:18px}
}
@media(max-width:420px){
  .hero h1{font-size:clamp(34px,10.4vw,46px)}
  .hero-sub{font-size:13px}
  .album-tab{width:54px;height:54px;flex-basis:54px}
  .player,.player iframe{height:360px;min-height:360px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <a class="brand" href="#top" aria-label="Grimorium Verum home"><img src="assets/grimorium-logo.png" alt="Grimorium Verum"></a>
  <nav><a href="#music">Music</a><a href="#live">Live</a><a href="#contact">Contact</a></nav>
</header>

<main id="top">
<section class="hero">
  <div class="hero-art"></div>
  <div class="hero-inner">
    <div class="hero-copy">
      <div class="hero-side"><div class="vline"></div><span>Death knows<br>no doctrine</span></div>
      <h1>Renaissance</h1>
      <div class="hero-sub">New album — 2026</div>
      <div class="listen">Listen</div>
      <div class="services">
        <a href="#music">Spotify</a><a href="#music">Apple Music</a><a href="#music">Яндекс Музыка</a>
      </div>
    </div>
  </div>
</section>

<section class="record" id="music">
  <div class="shell">
    <div class="record-head"><h2>Discography</h2></div>
    <div class="discography-grid">
      <div class="album-tabs" id="albumTabs" aria-label="Albums"></div>

      <div class="track-col">
        <h3 id="recordTitle">REALL</h3>
        <div class="rule"></div>
        <div id="tracklist"></div>
      </div>

      <div class="cover-col">
        <div class="cover-wrap" id="coverWrap"></div>
        <div class="album-name" id="albumName"></div>
      </div>

      <div class="stream-col">
        <div class="player" id="spotifyPlayer"></div>
      </div>

      <div class="platforms" aria-label="Streaming platforms">
        <a class="platform" id="spotifyLink" target="_blank" rel="noopener" aria-label="Spotify" title="Spotify"><img src="https://cdn.simpleicons.org/spotify/d8d8d2" alt=""></a>
        <a class="platform" id="appleLink" target="_blank" rel="noopener" aria-label="Apple Music" title="Apple Music"><img src="https://cdn.simpleicons.org/applemusic/d8d8d2" alt=""></a>
        <a class="platform" id="yandexLink" target="_blank" rel="noopener" aria-label="Yandex Music" title="Yandex Music"><img src="assets/yandex-music.png" alt=""></a>
      </div>
    </div>
  </div>
</section>

<section class="bottom">
  <div class="live" id="live">
    <div class="live-inner">
      <h2>Live</h2><div class="rule"></div>
      <p>No upcoming dates currently listed.</p>
    </div>
  </div>

  <div class="contact" id="contact">
    <div class="contact-inner">
      <div class="contact-row">
        <div class="contact-copy">
          <h2>Contact</h2><div class="rule"></div>
          <p>Booking · Press · General</p>
          <div class="socials">
            <a class="social-link" href="https://vk.com/grimorium_verum" target="_blank" rel="noopener" aria-label="VK" title="VK"><img src="https://cdn.simpleicons.org/vk/d8d8d2" alt=""></a>
            <a class="social-link" href="https://www.instagram.com/grimoriumv" target="_blank" rel="noopener" aria-label="Instagram" title="Instagram"><img src="https://cdn.simpleicons.org/instagram/d8d8d2" alt=""></a>
            <a class="social-link" href="https://www.facebook.com/grimoriumverumband" target="_blank" rel="noopener" aria-label="Facebook" title="Facebook"><img src="https://cdn.simpleicons.org/facebook/d8d8d2" alt=""></a>
            <a class="social-link" href="mailto:contact@grimorium-verum.ru" aria-label="Email" title="Email">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5h17v11h-17z"/><path d="m4 7 8 6 8-6"/></svg>
            </a>
          </div>
        </div>
        <a class="email-text" href="mailto:contact@grimorium-verum.ru">contact@grimorium-verum.ru</a>
      </div>
    </div>
  </div>
</section>
</main>

<footer><span>© 2026 Grimorium Verum</span><span>Syktyvkar · Russia</span></footer>

<script>
const ARTIST_EMBED="https://open.spotify.com/embed/artist/65nL8HSKtOigMf9h8d4rUK?utm_source=generator&theme=0";
const ALBUMS=[
  {
    id:"reall",title:"REALL",year:"2022",
    cover:"https://grimorium-verum.ru/images/page2-img6.jpg",
    spotifyEmbed:ARTIST_EMBED,
    tracks:["Through the Labyrinth of Times","The Black Church of Eternity","The Lamp of Destiny","Hourglass","Last Ritual","In the Catacombs","Burn Gypsy Burn","Broken Hourglass","It's Time... Padre","A Slave of the Lamp","REALL"],
    credits:"Music recorded at Dead Witch Studio. Vocals recorded at R&W Studio. Mixed & mastered at Dead Witch Studio."
  },
  {
    id:"revenant",title:"Revenant",year:"2018",
    cover:"https://grimorium-verum.ru/images/page2-img5.jpg",
    spotifyEmbed:ARTIST_EMBED,
    tracks:["The Born Son of the Devil","The Kingdom of the Pain","The March of the Northern Kings","Blind Faith in Nothing","The Light of Dark Father","Revenant","The Circus of the Dark Illusion","Sacred Temple of Blood","The Great Serpentine Saint","The Resurrected on the Devil's Hands"],
    credits:"Music recorded at Dead Witch Studio. Vocals recorded at R&W Studio. Mixed & mastered at Dead Witch Studio."
  },
  {
    id:"relict",title:"Relict",year:"2015",
    cover:"https://grimorium-verum.ru/images/page2-img4.jpg",
    spotifyEmbed:"https://open.spotify.com/embed/track/6vY6dF2S1GYmiHFS7SsLJr?utm_source=generator&theme=0",
    tracks:["Relict","Rising Morning Star","At the Gates of Darkness","Black Tears Monastery","Night Burning Icons","The Vision in Solar Eclipse","Pilgrimage to Satan","In Satan We Trust","The Truth Forgotten in Time","Odium"],
    credits:"Music recorded at Dead Witch Studio. Vocals recorded at R&W Studio. Mixed at Dead Witch Studio."
  },
  {
    id:"reborn",title:"Reborn",year:"2011",
    cover:"https://grimorium-verum.ru/images/page2-img1.jpg",
    spotifyEmbed:ARTIST_EMBED,
    tracks:["Among Ancient Walls","Wolf Bite","Witch","Torture","Unfetter","White Spirit of the Dark Side","Fall into Oblivion","Immortal Soul"],
    credits:"Recorded at Dead Witch Studio."
  },
  {
    id:"retaliation",title:"Retaliation",year:"2008",
    cover:"https://www.metal-archives.com/images/3/8/6/2/386271.jpg",
    spotifyEmbed:ARTIST_EMBED,
    tracks:["Intro - Undercover Guest","Sacrifice","Funeral","God of Nothing","Homohereticus","Last Night of Vampire","A Time to Kill","Curse of Voodoo","Gollywog","Egypt","Twisted Human Form","Digging Grave","...from the Grave","Painted Black","Outro"],
    credits:"Recorded at Dead Witch Studio."
  }
];

const tabs=document.getElementById("albumTabs");
const recordTitle=document.getElementById("recordTitle");
const tracklist=document.getElementById("tracklist");
const coverWrap=document.getElementById("coverWrap");
const albumName=document.getElementById("albumName");
const spotifyLink=document.getElementById("spotifyLink");
const appleLink=document.getElementById("appleLink");
const yandexLink=document.getElementById("yandexLink");
const spotifyPlayer=document.getElementById("spotifyPlayer");

function query(a){return encodeURIComponent("Grimorium Verum "+a.title)}

function renderTabs(){
  tabs.innerHTML=ALBUMS.map((a,i)=>`
    <button class="album-tab ${i===0?"active":""}" data-id="${a.id}" aria-label="${a.title} ${a.year}" title="${a.title} · ${a.year}">
      <span class="tab-fallback">${a.title.slice(0,2).toUpperCase()}</span>
      <img src="${a.cover}" alt="" onerror="this.remove()">
    </button>`).join("");
  tabs.querySelectorAll(".album-tab").forEach(b=>b.addEventListener("click",()=>selectAlbum(b.dataset.id)));
}

function selectAlbum(id){
  const a=ALBUMS.find(x=>x.id===id);if(!a)return;
  tabs.querySelectorAll(".album-tab").forEach(b=>b.classList.toggle("active",b.dataset.id===id));
  recordTitle.textContent=a.title;
  tracklist.innerHTML=a.tracks.map((t,i)=>`<div class="track"><span>${String(i+1).padStart(2,"0")}</span><span>${t}</span></div>`).join("");

  coverWrap.innerHTML=`<img class="cover" src="${a.cover}" alt="${a.title} album cover">`;
  const selectedCover=coverWrap.querySelector("img");
  selectedCover.addEventListener("error",()=>{coverWrap.innerHTML=`<div class="cover-fallback">${a.title}</div>`;});

  albumName.textContent=`${a.title} · ${a.year}`;

  const spotifySearch="https://open.spotify.com/search/"+query(a);
  spotifyLink.href=spotifySearch;
  appleLink.href="https://music.apple.com/us/search?term="+query(a);
  yandexLink.href="https://music.yandex.ru/search?text="+query(a)+"&type=albums";

  spotifyPlayer.innerHTML=`<iframe
    src="${a.spotifyEmbed}"
    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
    loading="lazy"
    title="${a.title} — Spotify player"></iframe>`;
}

renderTabs();
selectAlbum("reall");

document.querySelectorAll('a[href^="#"]').forEach(a=>a.addEventListener("click",e=>{
  const el=document.querySelector(a.getAttribute("href"));
  if(el){e.preventDefault();el.scrollIntoView({behavior:"smooth"})}
}));
</script>
</body>
</html>
